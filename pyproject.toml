[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.4.0"
description = "Structured atomic fact memory for LLM agents — typed, confidence-scored, evolution-tracked"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["agent", "memory", "llm", "ai", "atomic-facts"]
authors = [
    {name = "siar765"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/siar765/agent-memory"
Repository = "https://github.com/siar765/agent-memory.git"
Documentation = "https://github.com/siar765/agent-memory"

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_memory*"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
test = ["pytest>=7.0"]
